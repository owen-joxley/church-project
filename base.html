<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kibiko SDA Church{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f8f9fa; }
        nav { background-color: #1a365d; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; color: white; }
        nav h2 { margin: 0; font-size: 20px; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover { color: #f6ad55; }
        
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), #1a365d; color: white; padding: 80px 30px; text-align: center; }
        .hero h1 { font-size: 48px; margin: 0; }
        .hero p { font-size: 20px; }
        .btn-hero { background: #f6ad55; color: black; padding: 15px 30px; text-decoration: none; border-radius: 30px; font-weight: bold; display: inline-block; margin-top: 20px; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: -40px; }
        .feat { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-align: center; }
        
        footer { text-align: center; padding: 20px; background: #1a365d; color: white; margin-top: 40px; }
    </style>
</head>
<body>
    <nav>
        <h2>⛪ KIBIKO SDA CHURCH</h2>
        <div>
            <a href="/">Home</a>
            <a href="/groups">Groups</a>
            <a href="/calendar">Events</a>
            <a href="/login">Login</a>
        </div>
    </nav>
    
    <!-- Dynamic page content loads here -->
    {% block content %}
    {% endblock %}

    <footer>
        <p>&copy; Kibiko SDA Church. All rights reserved.</p>
    </footer>
</body>
</html>
